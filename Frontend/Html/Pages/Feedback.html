<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Appointments</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
}

.completed{background:green;}
.booked{background:orange;}
.cancelled{background:red;}

textarea,input{
    width:100%;
    margin-top:5px;
    padding:8px;
}

button{
    margin-top:10px;
    padding:8px 12px;
    cursor:pointer;
}

.cancel-message {
    background: #ffe0e0;
    padding: 8px;
    border-radius: 8px;
    color: #c62828;
    font-size: 13px;
    text-align: center;
}
</style>
</head>

<body>

<h2>My Appointments</h2>

<div id="container"></div>

<script>

const API = "http://127.0.0.1:8000/api/my-appointments";
const FEEDBACK_API = "http://127.0.0.1:8000/api/feedback";

const token = localStorage.getItem("token");

// 🔴 CHECK LOGIN
if (!token) {
    alert("Please login first to access your appointments");
    window.location.href = "../Auth/Login.html";
}
let appointments = [];

/* ================= HELPER: Check if appointment is cancelled ================= */
function isCancelled(status) {
    if (!status) return false;
    return status.toLowerCase().startsWith('cancelled');
}

/* ================= LOAD APPOINTMENTS ================= */
async function loadAppointments() {

    let res = await fetch(API, {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    let data = await res.json();

    appointments = data.data;

    let container = document.getElementById("container");
    container.innerHTML = "";

    appointments.forEach(app => {
        const cancelled = isCancelled(app.status);

        // Determine the feedback section
        let feedbackHtml = '';
        if (cancelled) {
            // Show a message instead of feedback form
            feedbackHtml = `<div class="cancel-message">❌ This appointment was cancelled. Feedback is not available.</div>`;
        } else if (app.feedback) {
            feedbackHtml = `
                <p>⭐ Rating: ${app.feedback.rating}</p>
                <p>${app.feedback.comment}</p>
            `;
        } else {
            // Show feedback form for active (booked/completed) appointments
            feedbackHtml = `
                <div>
                    <h4>Give Feedback</h4>
                    <input type="number" min="1" max="5" id="rating_${app.appointment_id}" placeholder="Rating 1-5">
                    <textarea id="comment_${app.appointment_id}" placeholder="Comment"></textarea>
                    <button onclick="submitFeedback(${app.appointment_id})">
                        Submit
                    </button>
                </div>
            `;
        }

        container.innerHTML += `
            <div class="card">
                <h3>Service: ${app.service.name}</h3>
                <p>Date: ${app.date} | Time: ${app.time}</p>
                <span class="badge ${cancelled ? 'cancelled' : app.status}">
                    ${cancelled ? 'CANCELLED' : app.status.toUpperCase()}
                </span>
                <hr>
                ${feedbackHtml}
            </div>
        `;
    });
}

/* ================= SUBMIT FEEDBACK ================= */
async function submitFeedback(id) {

    let rating = document.getElementById("rating_" + id).value;
    let comment = document.getElementById("comment_" + id).value;

    let res = await fetch(FEEDBACK_API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            appointment_id: id,
            rating: rating,
            comment: comment
        })
    });

    let data = await res.json();

    if (data.status) {
        alert("Feedback submitted");
        loadAppointments();
    } else {
        alert(data.message);
    }
}

/* ================= INIT ================= */
loadAppointments();

</script>

</body>
</html>
