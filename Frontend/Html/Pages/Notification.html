<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Notifications</title>
<link rel="stylesheet" href="../../Css/index.css">
 
<style>
    /* Import Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

    /* Global Reset & Base Styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #F8F8F8;
        font-family: 'Inter', 'Montserrat', sans-serif;
        line-height: 1.7;
        color: #2E2E2E;
        padding: 2rem;
        min-height: 100vh;
    }

    /* Navigation Header - White card style */
    .nav {
        max-width: 800px;
        margin: 0 auto 2rem auto;
        background: #FFFFFF;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
        padding: 1.2rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .nav h3 {
        font-size: 1.4rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #2E2E2E;
        margin: 0;
    }

    /* Unread Count Badge - Coral background, pill shape */
    .badge {
        background-color: #FF715B;
        color: #FFFFFF;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.3rem 0.8rem;
        border-radius: 40px;
        box-shadow: 0 2px 8px rgba(255, 113, 91, 0.3);
        display: inline-block;
        min-width: 36px;
        text-align: center;
    }

    /* Main Container */
    .container {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    /* Notification Card */
    .noti-card {
        background: #FFFFFF;
        border-radius: 18px;
        padding: 1.2rem 1.5rem;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border-left: 4px solid transparent;
    }

    .noti-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
    }

    /* Unread status styling */
    .noti-card.unread {
        border-left-color: #FF715B;
        background: linear-gradient(90deg, rgba(255, 113, 91, 0.02) 0%, #FFFFFF 5%);
    }

    .noti-card.read {
        border-left-color: transparent;
        opacity: 0.85;
    }

    /* Message text */
    .msg {
        font-size: 1rem;
        line-height: 1.6;
        color: #2E2E2E;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    /* Reason line - new line, coral tone */
    .reason-line {
        font-size: 0.85rem;
        color: #c62828;
        background: rgba(198, 40, 40, 0.05);
        padding: 0.3rem 0.6rem;
        border-radius: 12px;
        margin-top: 0.5rem;
        display: inline-block;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    /* Date text */
    .date {
        font-size: 0.75rem;
        color: #b0b0b0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 500;
        margin-top: 0.6rem;
    }

    /* Loading and empty states */
    .container > p {
        background: #FFFFFF;
        border-radius: 18px;
        padding: 2rem;
        text-align: center;
        color: #4a4a4a;
        font-size: 0.95rem;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
    }

    /* Responsive */
    @media (max-width: 600px) {
        body {
            padding: 1rem;
        }
        .nav {
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
        }
        .nav h3 {
            font-size: 1.2rem;
        }
        .badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.7rem;
        }
        .noti-card {
            padding: 1rem 1.2rem;
        }
        .msg {
            font-size: 0.9rem;
        }
        .reason-line {
            font-size: 0.75rem;
        }
        .date {
            font-size: 0.7rem;
        }
    }
</style>
</head>

<body>
    <!-- Navigation Bar -->
    <div class="nav-bar">
        <h1>Blush & Bloom Salon</h1>
        <div class="links">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./Service.html">Services</a></li>
                <li><a href="./Notification.html">Notifications</a></li>
                <li><a href="./Feedback.html">Feedback</a></li>
            </ul>
        </div>
    </div>

    <div class="nav">
        <h3>My Notifications</h3>
        <span class="badge" id="count">0</span>
    </div>

    <div class="container" id="notificationList">
        Loading notifications...
    </div>

    <script>
        let token = localStorage.getItem("token");

        if (!token) {
            alert("Please login first");
            window.location.href = "../Auth/Login.html";
        }

        // Helper: format message with reason on new line
        function formatMessageWithReason(message) {
            // Check if message contains "Reason:"
            if (message && message.includes("Reason:")) {
                let parts = message.split(/Reason:/i);
                let mainText = parts[0].trim();
                let reasonText = parts[1] ? parts[1].trim() : "";
                if (reasonText) {
                    return `
                        <div class="msg">${escapeHtml(mainText)}</div>
                        <div class="reason-line"><i class="fas fa-info-circle"></i> Reason: ${escapeHtml(reasonText)}</div>
                    `;
                }
            }
            // Fallback: show whole message normally
            return `<div class="msg">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function loadNotifications() {
            try {
                let res = await fetch("http://127.0.0.1:8000/api/user/notifications", {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                let data = await res.json();
                let container = document.getElementById("notificationList");

                if (!data || data.length === 0) {
                    container.innerHTML = "<p>No notifications found</p>";
                    return;
                }

                let unreadCount = 0;
                let html = "";

                data.forEach(n => {
                    if (n.status === "unread") unreadCount++;
                    html += `
                        <div class="noti-card ${n.status}">
                            ${formatMessageWithReason(n.message)}
                            <div class="date">${n.date ?? ""}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById("count").innerText = unreadCount;

            } catch (error) {
                console.log(error);
                document.getElementById("notificationList").innerHTML = "<p>Error loading notifications</p>";
            }
        }

        loadNotifications();
    </script>
</body>
</html>
